# Optional external-custody override for the default managed Docker key volume.
# Provision the host keyring first; this mount replaces the default volume read-only.
services:
  backend:
    environment:
      INTEGRATION_KEYRING_FILE: /run/nodeherder-secrets/integration-keyring.json
      INTEGRATION_KEYRING_DIR: ""
      INTEGRATIONS_CONFIG_DIR: /backend/configs/integrations
      DATA_DIR: /backend/data
    volumes:
      - type: bind
        source: ${NODEHERDER_SECRETS_DIR:?Set NODEHERDER_SECRETS_DIR to a private directory outside the checkout}
        target: /run/nodeherder-secrets
        read_only: true
        bind:
          create_host_path: false
