# UK severe-weather warnings; the API key belongs in Setup, never in this file.
---
schema_version: nodeherder.integration/v1
integration_type: alerts
capability: weather_alerts/v1
policy:
  poll_min_seconds: 5
  renewal_min_seconds: 86400
  idempotency_window_seconds: 0
  refresh_default_seconds: 900
  refresh_min_seconds: 300
errors:
  code: ''
  rules: []
inputs:
  location:
    type: text
    label: Town or postcode
    required: true
  coordinates:
    type: select
    label: Choose location
    required: true
refresh:
  request: warnings
id: met_office
name: Met Office Warnings
base_url: https://data.hub.api.metoffice.gov.uk/nswws/v1.1
auth:
  mode: apikey_header
  secret_slot: apikey
requests:
  search:
    method: GET
    path:
    - v1
    - search
    query:
      name:
        ref: input.location
      count: 10
      language: en
  postcode_search:
    method: GET
    path:
    - postcodes
    query:
      query:
        ref: input.location
      limit: 10
  warnings:
    method: GET
    path:
    - objects
    - feed
    discover:
      format: atom
      rel: related
      same_origin: true
setup:
  type: location_select
  search:
    input: location
    request: search
    options:
      items: "/results"
      value: "/name"
      label: "/name"
      context: ["/admin2", "/admin1", "/country"]
      latitude: "/latitude"
      longitude: "/longitude"
    base_url: https://geocoding-api.open-meteo.com
    postcode:
      base_url: https://api.postcodes.io
      request: postcode_search
      options:
        items: "/result"
        label: "/postcode"
        context: ["/admin_district", "/country"]
        latitude: "/latitude"
        longitude: "/longitude"
  select:
    input: coordinates
    request: warnings
  status:
    request: ''
    pointer: ''
    pending: []
    done: []
    failed: []
mapping:
  attribution: "Warnings: Met Office National Severe Weather Warning Service."
  warnings:
    items: "/features"
    format: rfc3339
    area_name: "/regionName"
    fields:
      warning_id: "/properties/warningId"
      level: "/properties/warningLevel"
      type: "/properties/weatherType"
      headline: "/properties/warningHeadline"
      description: "/properties/warningFurtherDetails"
      instruction: "/properties/whatShouldIDo"
      areas: "/properties/affectedAreas"
      valid_from: "/properties/validFromDate"
      valid_to: "/properties/validToDate"
      issued_at: "/properties/issuedDate"
      modified_at: "/properties/modifiedDate"
      polygon: "/geometry"
