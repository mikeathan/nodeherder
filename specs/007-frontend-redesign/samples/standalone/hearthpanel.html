<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeHerder · Hearth + Panel design sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lexend:wght@300;400;500&display=swap">
<style>
/* NodeHerder samples — structure + components. Skins (../designs/*.css) only set tokens
   and add chrome. Every colour below is a --nh-* token (design-system.md). */
:root {
  --nh-r: 12; --nh-scale: 1;
  --nh-radius-s: calc(var(--nh-r) * 0.5px); --nh-radius-m: calc(var(--nh-r) * 1px); --nh-radius-l: calc(var(--nh-r) * 1.4px);
  --nh-font-ui: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  --nh-font-display: var(--nh-font-ui); --nh-font-mono: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  --nh-border-w: 1px; --nh-nav-w: 15rem; --nh-area-w: 17rem; --nh-motion: 160ms;
  --nh-shadow-1: 0 1px 2px rgb(0 0 0 / 0.08); --nh-shadow-2: 0 8px 28px rgb(0 0 0 / 0.18);
  --nh-accent-soft: color-mix(in srgb, var(--nh-accent) 16%, transparent);
  --nh-ok-soft: color-mix(in srgb, var(--nh-ok) 16%, transparent); --nh-warn-soft: color-mix(in srgb, var(--nh-warn) 18%, transparent);
  --nh-danger-soft: color-mix(in srgb, var(--nh-danger) 16%, transparent); --nh-info-soft: color-mix(in srgb, var(--nh-info) 16%, transparent);
  --nh-focus: var(--nh-accent); --nh-on: var(--nh-accent);
  font-size: calc(100% * var(--nh-scale));
}
[data-density='compact'] { --nh-space: 0.7rem; --nh-ctl-h: 2rem; --nh-tile-h: 3.6rem; --nh-gap: 0.5rem; }
:root, [data-density='comfortable'] { --nh-space: 1rem; --nh-ctl-h: 2.5rem; --nh-tile-h: 4.4rem; --nh-gap: 0.75rem; }
[data-density='spacious'] { --nh-space: 1.3rem; --nh-ctl-h: 2.85rem; --nh-tile-h: 5.2rem; --nh-gap: 1rem; }
@media (prefers-reduced-motion: reduce) { :root { --nh-motion: 0ms; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--nh-bg); color: var(--nh-text); font: 400 0.9375rem/1.45 var(--nh-font-ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
code { font-family: var(--nh-font-mono); font-size: 0.85em; }
small { font-size: 0.8em; }
h1, h2, h3 { margin: 0; font-family: var(--nh-font-display); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.nh-ic { width: 1.25em; height: 1.25em; flex: none; }
:focus-visible { outline: 2px solid var(--nh-focus); outline-offset: 2px; }
.nh-muted { color: var(--nh-text-muted); }
.nh-pad { padding: var(--nh-space); margin: 0; }
.nh-help { color: var(--nh-text-muted); font-size: 0.85rem; margin: 0.4rem 0 0; }

/* ---------- shell ---------- */
.nh-skip { position: fixed; left: 0.5rem; top: -3rem; z-index: 200; }
.nh-skip:focus { top: 0.5rem; }
.nh-app { display: grid; grid-template-columns: var(--nh-nav-w) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.nh-nav { display: flex; flex-direction: column; gap: 0.25rem; background: var(--nh-nav-bg, var(--nh-surface)); color: var(--nh-nav-text, var(--nh-text)); border-right: var(--nh-border-w) solid var(--nh-border); padding: 0.75rem 0.6rem; overflow-y: auto; }
.nh-brand { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.5rem 0.9rem; font-family: var(--nh-font-display); }
.nh-brand-logo { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: var(--nh-radius-m); background: var(--nh-accent); color: var(--nh-accent-contrast); }
.nh-brand-logo .nh-ic { width: 1.25rem; height: 1.25rem; }
.nh-brand-name { font-size: 1.1rem; letter-spacing: -0.01em; }
.nh-brand-ver { margin-left: auto; font-size: 0.7rem; color: var(--nh-text-muted); }
.nh-nav-list { display: flex; flex-direction: column; gap: 0.15rem; }
.nh-nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.15rem; padding-top: 0.75rem; border-top: var(--nh-border-w) solid var(--nh-border); }
.nh-nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0 0.7rem; min-height: var(--nh-ctl-h); border-radius: var(--nh-radius-m); text-decoration: none; color: inherit; background: none; border: 0; font: inherit; cursor: pointer; text-align: left; width: 100%; transition: background var(--nh-motion); }
.nh-nav-item:hover { background: var(--nh-nav-hover, var(--nh-surface-2)); }
.nh-nav-item.is-active { background: var(--nh-accent-soft); color: var(--nh-nav-active, var(--nh-accent)); font-weight: 600; }
.nh-nav-item.nh-permit.is-on { color: var(--nh-accent); }
.nh-nav-key { display: none; font-family: var(--nh-font-mono); font-size: 0.75rem; }
.nh-nav-ic { display: grid; place-items: center; }
.nh-scrim { display: none; }
.nh-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.nh-header { display: flex; align-items: center; gap: 0.75rem; min-height: 3.5rem; padding: 0 var(--nh-space); background: var(--nh-header-bg, var(--nh-bg)); border-bottom: var(--nh-border-w) solid var(--nh-header-border, var(--nh-border)); }
.nh-header-title { font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.nh-header-title > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nh-window-dots { display: none; }
.nh-header-actions { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }
.nh-menu-btn { display: none !important; }
.nh-user { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--nh-text-muted); font-size: 0.85rem; padding: 0 0.3rem; }
.nh-conn { display: inline-flex; align-items: center; gap: 0.45rem; height: 2rem; padding: 0 0.7rem; border-radius: 99px; border: var(--nh-border-w) solid var(--nh-border); background: var(--nh-surface); color: var(--nh-text); font: inherit; font-size: 0.8rem; cursor: pointer; }
.nh-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--nh-ok); box-shadow: 0 0 0 3px var(--nh-ok-soft); }
.nh-conn.is-connecting .nh-dot { background: var(--nh-warn); box-shadow: 0 0 0 3px var(--nh-warn-soft); animation: nh-pulse 1s infinite; }
.nh-conn.is-disconnected .nh-dot { background: var(--nh-danger); box-shadow: 0 0 0 3px var(--nh-danger-soft); }
.nh-content { flex: 1; overflow: auto; padding: calc(var(--nh-space) * 1.25) calc(var(--nh-space) * 1.5) 6rem; outline: none; }
.nh-banner { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem var(--nh-space); font-size: 0.875rem; border-bottom: var(--nh-border-w) solid var(--nh-border); }
.nh-banner > span { flex: 1; }
.nh-banner.is-warn { background: var(--nh-warn-soft); } .nh-banner.is-danger { background: var(--nh-danger-soft); } .nh-banner.is-info { background: var(--nh-accent-soft); }
.nh-banner .nh-ic { color: var(--nh-text); }

@media (max-width: 860px) {
  .nh-app { grid-template-columns: minmax(0, 1fr); }
  .nh-nav { position: fixed; inset: 0 auto 0 0; width: min(18rem, 85vw); z-index: 60; transform: translateX(-105%); transition: transform var(--nh-motion); box-shadow: var(--nh-shadow-2); }
  [data-nav-open='true'] .nh-nav { transform: none; }
  [data-nav-open='true'] .nh-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgb(0 0 0 / 0.4); }
  .nh-menu-btn { display: inline-flex !important; }
  .nh-user span, .nh-conn-txt { display: none; }
  .nh-content { padding: var(--nh-space) var(--nh-space) 6rem; }
}

/* ---------- primitives ---------- */
.nh-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; min-height: var(--nh-ctl-h); padding: 0 0.95rem; border-radius: var(--nh-radius-m); border: var(--nh-border-w) solid var(--nh-btn-border, var(--nh-border)); background: var(--nh-btn-bg, var(--nh-surface)); color: var(--nh-text); font: 500 0.875rem/1 var(--nh-font-ui); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--nh-motion), border-color var(--nh-motion), transform 80ms; }
.nh-btn:hover:not(:disabled) { background: var(--nh-surface-2); border-color: var(--nh-border-strong); }
.nh-btn:active:not(:disabled) { transform: translateY(1px); }
.nh-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.nh-btn.is-primary { background: var(--nh-accent); border-color: var(--nh-accent); color: var(--nh-accent-contrast); }
.nh-btn.is-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--nh-accent) 85%, var(--nh-text)); border-color: transparent; }
.nh-btn.is-ghost { background: transparent; border-color: transparent; }
.nh-btn.is-danger { color: var(--nh-danger); }
.nh-btn.is-danger:hover:not(:disabled) { background: var(--nh-danger-soft); }
.nh-btn.is-icon { width: var(--nh-ctl-h); padding: 0; }
.nh-btn.is-sm { min-height: calc(var(--nh-ctl-h) * 0.8); font-size: 0.8rem; padding: 0 0.65rem; }
.nh-btn.is-icon.is-sm { width: calc(var(--nh-ctl-h) * 0.8); padding: 0; }
.nh-btn.is-block { width: 100%; }
.nh-chip { display: inline-flex; align-items: center; gap: 0.3rem; height: 1.6rem; padding: 0 0.55rem; border-radius: 99px; background: var(--nh-chip-bg, var(--nh-surface-2)); color: var(--nh-text); font-size: 0.75rem; font-weight: 500; white-space: nowrap; border: var(--nh-border-w) solid transparent; }
.nh-chip .nh-ic { width: 0.95rem; height: 0.95rem; }
.nh-chip.is-ok { background: var(--nh-ok-soft); color: var(--nh-ok-text, var(--nh-text)); } .nh-chip.is-ok .nh-ic { color: var(--nh-ok); }
.nh-chip.is-warn { background: var(--nh-warn-soft); } .nh-chip.is-warn .nh-ic { color: var(--nh-warn); }
.nh-chip.is-danger { background: var(--nh-danger-soft); } .nh-chip.is-danger .nh-ic { color: var(--nh-danger); }
.nh-chip.is-info { background: var(--nh-info-soft); } .nh-chip.is-info .nh-ic { color: var(--nh-info); }
.nh-chip.is-accent { background: var(--nh-accent-soft); } .nh-chip.is-accent .nh-ic { color: var(--nh-accent); }
.nh-chip.is-muted { color: var(--nh-text-muted); }
.nh-chip.is-proto-mqtt .nh-ic { color: var(--nh-kind-zigbee, #e5a50a); } .nh-chip.is-proto-http .nh-ic { color: var(--nh-kind-wifi, #3b82f6); }
.nh-chip.is-btn { cursor: pointer; border-color: var(--nh-border); font: inherit; font-size: 0.85rem; height: auto; padding: 0.45rem 0.8rem; white-space: normal; text-align: left; }
.nh-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
.nh-input, .nh-select { height: var(--nh-ctl-h); padding: 0 0.7rem; border-radius: var(--nh-radius-s); border: var(--nh-border-w) solid var(--nh-input-border, var(--nh-border-strong)); background: var(--nh-input-bg, var(--nh-surface)); color: var(--nh-text); font: inherit; font-size: 0.9rem; min-width: 0; }
.nh-input:focus, .nh-select:focus { outline: 2px solid var(--nh-focus); outline-offset: -1px; }
.nh-input[aria-invalid='true'], .nh-select[aria-invalid='true'] { border-color: var(--nh-danger); box-shadow: 0 0 0 3px var(--nh-danger-soft); }
.nh-input.is-num { width: 6rem; }
textarea.nh-input { height: auto; padding: 0.6rem 0.7rem; resize: none; }
.nh-select { padding-right: 1.6rem; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--nh-text-muted) 50%), linear-gradient(135deg, var(--nh-text-muted) 50%, transparent 50%); background-position: calc(100% - 0.9rem) 55%, calc(100% - 0.6rem) 55%; background-size: 0.3rem 0.3rem; background-repeat: no-repeat; }
.nh-select.is-op { width: 4.2rem; }
.nh-unit-input { display: inline-flex; align-items: center; gap: 0.3rem; } .nh-unit-input em { font-style: normal; color: var(--nh-text-muted); font-size: 0.8rem; }
.nh-toggle { position: relative; display: inline-flex; align-items: center; width: 2.9rem; height: 1.6rem; border-radius: 99px; border: var(--nh-border-w) solid var(--nh-border-strong); background: var(--nh-toggle-off, var(--nh-surface-2)); cursor: pointer; padding: 0; flex: none; transition: background var(--nh-motion); }
.nh-toggle-knob { position: absolute; left: 0.15rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--nh-knob, #fff); box-shadow: 0 1px 3px rgb(0 0 0 / 0.3); transition: transform var(--nh-motion); }
.nh-toggle-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.nh-toggle[aria-checked='true'] { background: var(--nh-accent); border-color: var(--nh-accent); }
.nh-toggle[aria-checked='true'] .nh-toggle-knob { transform: translateX(1.3rem); }
.nh-toggle:disabled { opacity: 0.45; cursor: not-allowed; }
.nh-toggle.is-pending { opacity: 0.7; } .nh-toggle.is-pending .nh-toggle-knob { animation: nh-pulse 0.9s infinite; }
.nh-seg { display: inline-flex; flex-wrap: wrap; border: var(--nh-border-w) solid var(--nh-border-strong); border-radius: var(--nh-radius-m); overflow: hidden; background: var(--nh-surface); }
.nh-seg button { border: 0; background: none; color: var(--nh-text); font: inherit; font-size: 0.82rem; padding: 0 0.75rem; min-height: calc(var(--nh-ctl-h) * 0.85); cursor: pointer; border-right: var(--nh-border-w) solid var(--nh-border); }
.nh-seg button:last-child { border-right: 0; }
.nh-seg button[aria-pressed='true'] { background: var(--nh-accent); color: var(--nh-accent-contrast); font-weight: 600; }
.nh-slider { width: 100%; accent-color: var(--nh-accent); }
.nh-check { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; cursor: pointer; font-size: 0.9rem; }
.nh-check input { accent-color: var(--nh-accent); width: 1.05rem; height: 1.05rem; }
.nh-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.2rem 1rem; margin-top: 0.5rem; }
.nh-field { display: flex; flex-direction: column; gap: 0.35rem; }
.nh-field > label { font-size: 0.8rem; font-weight: 600; color: var(--nh-text-muted); display: flex; justify-content: space-between; gap: 0.5rem; }
.nh-field.is-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 0.6rem; }
.nh-form { display: flex; flex-direction: column; gap: 1rem; }
.nh-form-foot { display: flex; justify-content: flex-end; }
.nh-err { display: flex; align-items: center; gap: 0.3rem; color: var(--nh-danger); font-size: 0.8rem; flex-basis: 100%; }
.nh-err .nh-ic { width: 1rem; height: 1rem; }
.nh-alert { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.9rem; border-radius: var(--nh-radius-m); background: var(--nh-surface-2); margin-bottom: var(--nh-space); font-size: 0.875rem; }
.nh-alert > span { flex: 1; }
.nh-alert.is-info { background: var(--nh-info-soft); } .nh-alert.is-warn { background: var(--nh-warn-soft); } .nh-alert.is-danger { background: var(--nh-danger-soft); }
.nh-alert.is-warn > .nh-ic { color: var(--nh-warn); } .nh-alert.is-danger > .nh-ic { color: var(--nh-danger); } .nh-alert.is-info > .nh-ic { color: var(--nh-info); }
.nh-spin { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: nh-rot 0.7s linear infinite; margin-right: 0.35em; vertical-align: -0.1em; }
.nh-pending-txt { color: var(--nh-text-muted); margin-right: 0.4rem; }
@keyframes nh-rot { to { transform: rotate(360deg); } }
@keyframes nh-pulse { 50% { opacity: 0.4; } }
.nh-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }

/* ---------- page / cards ---------- */
.nh-page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem; margin-bottom: calc(var(--nh-space) * 1.1); }
.nh-h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.015em; line-height: 1.2; }
.nh-sub { margin: 0.25rem 0 0; color: var(--nh-text-muted); font-size: 0.9rem; }
.nh-page-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.nh-card { background: var(--nh-surface); border: var(--nh-border-w) solid var(--nh-card-border, var(--nh-border)); border-radius: var(--nh-radius-l); box-shadow: var(--nh-card-shadow, var(--nh-shadow-1)); margin-bottom: var(--nh-space); overflow: hidden; }
.nh-card-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem var(--nh-space); border-bottom: var(--nh-border-w) solid var(--nh-border); background: var(--nh-card-head-bg, transparent); }
.nh-card-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 650; }
.nh-card-title .nh-ic { color: var(--nh-accent); }
.nh-card-meta { margin-left: auto; color: var(--nh-text-muted); font-size: 0.78rem; }
.nh-card-head > .nh-btn, .nh-card-head > .nh-chip { margin-left: auto; }
.nh-card-meta + .nh-btn { margin-left: 0; }
.nh-card-body { padding: var(--nh-space); }
.nh-card-foot { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.7rem var(--nh-space); border-top: var(--nh-border-w) solid var(--nh-border); }
.nh-cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--nh-space); align-items: start; }
.nh-col-side { display: flex; flex-direction: column; }
@media (max-width: 1100px) { .nh-cols { grid-template-columns: minmax(0, 1fr); } }
.nh-kv { display: grid; grid-template-columns: minmax(7rem, max-content) 1fr; gap: 0.55rem 1rem; margin: 0; padding: var(--nh-space); font-size: 0.9rem; align-items: center; }
.nh-kv dt { color: var(--nh-text-muted); } .nh-kv dd { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; min-width: 0; overflow-wrap: anywhere; }
.nh-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; margin-bottom: var(--nh-space); }
.nh-filter { display: flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; color: var(--nh-text-muted); }
.nh-search { position: relative; display: flex; align-items: center; flex: 1 1 16rem; max-width: 26rem; }
.nh-search > .nh-ic { position: absolute; left: 0.65rem; color: var(--nh-text-muted); }
.nh-search .nh-input { width: 100%; padding-left: 2.2rem; }
.nh-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; padding: 2.5rem 1rem; color: var(--nh-text-muted); }
.nh-empty > .nh-ic { width: 2.5rem; height: 2.5rem; color: var(--nh-accent); }
.nh-empty h3 { color: var(--nh-text); font-size: 1.05rem; } .nh-empty p { margin: 0 0 0.5rem; max-width: 28rem; }
.nh-empty.is-error > .nh-ic { color: var(--nh-danger); }
.nh-skel-card { display: flex; flex-direction: column; gap: 0.6rem; padding: 1rem; }
.nh-skel { display: block; height: 0.9rem; border-radius: 4px; background: linear-gradient(90deg, var(--nh-surface-2), var(--nh-border), var(--nh-surface-2)); background-size: 200% 100%; animation: nh-shimmer 1.4s infinite linear; }
.nh-skel.is-short { width: 55%; }
@keyframes nh-shimmer { to { background-position: -200% 0; } }

/* ---------- tiles / areas ---------- */
.nh-areas { columns: var(--nh-area-w) 6; column-gap: calc(var(--nh-space) * 1.4); }
.nh-area { break-inside: avoid; margin-bottom: calc(var(--nh-space) * 1.5); }
.nh-areas.is-edit .nh-area { outline: 2px dashed var(--nh-border-strong); outline-offset: 0.4rem; border-radius: var(--nh-radius-m); }
.nh-area-head { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.6rem 0.15rem; }
.nh-area-head h2 { font-size: 1rem; font-weight: 600; }
.nh-area-count { font-size: 0.75rem; color: var(--nh-text-muted); }
.nh-area-tools { margin-left: auto; display: flex; gap: 0.25rem; }
.nh-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 8rem), 1fr)); gap: var(--nh-gap); }
.nh-kit .nh-tiles { grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); }
.nh-tile { position: relative; display: flex; align-items: center; gap: 0.65rem; min-height: var(--nh-tile-h); padding: 0.5rem 0.6rem; border-radius: var(--nh-radius-l); background: var(--nh-tile-bg, var(--nh-surface)); border: var(--nh-border-w) solid var(--nh-tile-border, var(--nh-border)); box-shadow: var(--nh-tile-shadow, var(--nh-shadow-1)); transition: background var(--nh-motion), border-color var(--nh-motion); }
.nh-tile:hover { border-color: var(--nh-border-strong); }
.nh-tile-ic { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; flex: none; border: 0; background: var(--nh-tile-ic-bg, var(--nh-surface-2)); color: var(--nh-kc, var(--nh-text-muted)); cursor: default; padding: 0; transition: background var(--nh-motion), color var(--nh-motion), box-shadow var(--nh-motion); }
button.nh-tile-ic { cursor: pointer; }
button.nh-tile-ic:hover:not(:disabled) { box-shadow: 0 0 0 3px var(--nh-accent-soft); }

.kind-power { --nh-kc: var(--nh-kind-power, #fb8c00); } .kind-light { --nh-kc: var(--nh-kind-light, #fbc02d); } .kind-switch { --nh-kc: var(--nh-kind-switch, var(--nh-accent)); }
.kind-motion { --nh-kc: var(--nh-kind-motion, #7e57c2); } .kind-contact { --nh-kc: var(--nh-kind-contact, #26a69a); } .kind-alarm { --nh-kc: var(--nh-kind-alarm, #e53935); }

/* ---------- overview ---------- */

/* ---------- device cards / rows ---------- */

/* ---------- table ---------- */
.nh-table-wrap { overflow-x: auto; border: var(--nh-border-w) solid var(--nh-border); border-radius: var(--nh-radius-l); background: var(--nh-surface); box-shadow: var(--nh-shadow-1); }

/* ---------- device page ---------- */
.nh-dev-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.9rem; margin-bottom: var(--nh-space); }

.nh-auto:hover { border-color: var(--nh-border-strong); }

.nh-auto-t { display: flex; flex-direction: column; min-width: 0; } .nh-auto-t small { color: var(--nh-text-muted); }

.nh-trig.is-collapsed .nh-trig-head { border-bottom: 0; }
.nh-trig-toggle { display: inline-flex; align-items: center; gap: 0.35rem; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; padding: 0.2rem; }
.nh-sentence { flex: 1 1 20rem; margin: 0; font-size: 0.875rem; color: var(--nh-text-muted); font-style: italic; }

.nh-block { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); position: relative; }

.nh-block.is-when { --nh-bc: var(--nh-flow-when, var(--nh-accent)); --nh-bc-text: var(--nh-accent-contrast); }
.nh-block.is-if { --nh-bc: var(--nh-flow-if, var(--nh-info)); } .nh-block.is-then { --nh-bc: var(--nh-flow-then, var(--nh-ok)); }
.nh-block-body { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.15rem 0 1.3rem; min-width: 0; }
.nh-src { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600; padding: 0 0.6rem; height: var(--nh-ctl-h); border-radius: var(--nh-radius-s); background: var(--nh-surface-2); }
.nh-cond, .nh-act { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.6rem; padding: 0.55rem 0.65rem; border-radius: var(--nh-radius-m); background: var(--nh-surface-2); border: var(--nh-border-w) solid var(--nh-border); }

.nh-act-n { display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--nh-flow-then, var(--nh-ok)); color: #fff; font-size: 0.75rem; font-weight: 700; }
.nh-act-body { display: flex; flex-direction: column; gap: 0.45rem; padding-left: 2.1rem; }
.nh-set-row { display: flex; flex-direction: column; gap: 0.25rem; }

.nh-arrow { color: var(--nh-text-muted); }
.nh-warn-list { list-style: none; margin: 0; padding: 0.6rem var(--nh-space); border-top: var(--nh-border-w) solid var(--nh-border); background: var(--nh-warn-soft); display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.82rem; }
.nh-warn-list li { display: flex; gap: 0.4rem; align-items: flex-start; } .nh-warn-list .nh-ic { color: var(--nh-warn); margin-top: 0.1rem; }
.nh-add-trig { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 1rem; border: 2px dashed var(--nh-border-strong); border-radius: var(--nh-radius-l); background: transparent; color: var(--nh-text-muted); font: inherit; font-weight: 600; cursor: pointer; }

.nh-err-sum, .nh-ok-sum, .nh-warn-sum { display: flex; align-items: center; gap: 0.4rem; margin: 0 0 0.3rem; font-size: 0.875rem; }
.nh-err-sum .nh-ic { color: var(--nh-danger); } .nh-ok-sum .nh-ic { color: var(--nh-ok); } .nh-warn-sum .nh-ic { color: var(--nh-warn); }
.nh-json { margin: 0; padding: var(--nh-space); max-height: 26rem; overflow: auto; font: 0.78rem/1.5 var(--nh-font-mono); background: var(--nh-surface-2); }
.nh-timeline { position: relative; height: 1.6rem; border-radius: var(--nh-radius-s); background: var(--nh-surface-2); border: var(--nh-border-w) solid var(--nh-border); overflow: hidden; }
.nh-tl-on { position: absolute; top: 0; bottom: 0; background: var(--nh-ok-soft); border-left: 2px solid var(--nh-ok); }
.nh-tl-mark { position: absolute; top: 0; bottom: 0; width: 3px; transform: translateX(-1px); }
.nh-tl-mark.is-enable { background: var(--nh-ok); } .nh-tl-mark.is-disable { background: var(--nh-danger); }
.nh-tl-now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--nh-text); opacity: 0.7; }
.nh-sched-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
.nh-sched-t { flex: 1; font-size: 0.85rem; font-weight: 600; } .nh-sched-t.is-enable::before, .nh-sched-t.is-disable::before { content: ''; display: inline-block; width: 0.55rem; height: 0.55rem; border-radius: 50%; margin-right: 0.4rem; background: var(--nh-ok); } .nh-sched-t.is-disable::before { background: var(--nh-danger); }

/* ---------- assistant ---------- */
.nh-chat { display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: var(--nh-space); height: calc(100dvh - 9rem); min-height: 26rem; }
.nh-chat-side { background: var(--nh-surface); border: var(--nh-border-w) solid var(--nh-border); border-radius: var(--nh-radius-l); overflow: auto; }
.nh-chat-side-head { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; border-bottom: var(--nh-border-w) solid var(--nh-border); }
.nh-chat-side-head h2 { font-size: 0.95rem; }

<script>
/* Registry of the sample designs (gallery + in-page design switcher). Round 3: Hearth + Panel (merged), Hearth and Deck — see ../design-directions.md. */
window.NH_DESIGNS = [
  { n: 1, id: 'hearthpanel', name: 'Hearth + Panel', file: 'hearthpanel.html', short: 'Recommended · Hearth app with a wall-panel mode',
    blurb: 'Hearth for every page (with the NodeHerder logo and a phone-friendly automation editor) plus Deck’s big-dial look as a full-screen panel mode for a wall tablet. Recent activity can be switched off.',

  { n: 2, id: 'hearth', name: 'Hearth', file: 'hearth.html', short: 'Areas of soft tiles · sidebar',
    blurb: 'Home Assistant–style areas and tiles. Sidebar and top bar; When / If / Then flow editor (now phone-friendly).',
    shell: 'sidebar', defaults: { mode: 'system', accent: 'preset', density: 'comfortable', radius: 14, fontScale: 100, preset: 'daylight', effects: true } },
  { n: 3, id: 'deck', name: 'Deck', file: 'deck.html', short: 'Wall-tablet panel · big dials · room pager',
    blurb: 'The full Deck layout from round 2, for comparison. Its look lives on as panel mode in Hearth + Panel.',

];
window.NH_DESIGN_FOR = function (id, extra) {
  const d = window.NH_DESIGNS.find((x) => x.id === id);
  return Object.assign({}, d, extra);
};
