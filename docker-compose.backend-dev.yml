services:
  backend:
    container_name: nodeherder-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4110:4110"
    env_file:
      - ./backend/.env
      - ./backend/.env.development
    volumes:
      - ./backend/configs:/backend/configs
      - ./backend/data:/backend/data
    environment:
      APP_ENV: development
