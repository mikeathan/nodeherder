services:
  backend:
    container_name: nodeherder-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4110:4110"
    env_file:
      - ./backend/.env
      - ./backend/.env.development
    volumes:
      - ./backend/configs:/backend/configs
      - ./backend/data:/backend/data
      - ./backend/logs:/backend/logs
      - integration-secrets:/run/nodeherder-secrets
    environment:
      APP_ENV: development
      INTEGRATION_KEYRING_FILE: ${INTEGRATION_KEYRING_FILE:-}
      INTEGRATION_KEYRING_DIR: /run/nodeherder-secrets/managed
      TZ: Europe/London

volumes:
  integration-secrets:
