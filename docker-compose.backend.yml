services:
  backend:
    container_name: nodeherder-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4110:4110"
    env_file:
      - ./backend/.env
      - ./backend/.env.production
    volumes:
      - ./backend/configs:/backend/configs
      - ./backend/data:/backend/data
      - ./backend/logs:/backend/logs
    environment:
      APP_ENV: production
      TZ: Europe/London
    depends_on:
      - mqtt
      - zigbee2mqtt
    networks:
      - nodeherder

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nodeherder-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in the root .env}/mqtt/data:/mosquitto/data
      - ${DATA_ROOT:?Set DATA_ROOT in the root .env}/mqtt/config:/mosquitto/config
      - ${DATA_ROOT:?Set DATA_ROOT in the root .env}/mqtt/log:/mosquitto/log
    networks:
      - nodeherder

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in the root .env}/zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8089:8080"
    environment:
      - TZ=Europe/London
    devices:
      - ${Z2M_DEVICE:?Set Z2M_DEVICE in the root .env}:${Z2M_SERIAL_PORT:?Set Z2M_SERIAL_PORT in the root .env}
    depends_on:
      - mqtt
    networks:
      - nodeherder

networks:
  nodeherder:
    driver: bridge
