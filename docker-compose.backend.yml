services:
  backend:
    container_name: nodeherder-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4110:4110"
    env_file:
      - ./backend/.env
      - ./backend/.env.production
    volumes:
      - ./backend/configs:/backend/configs
      - ./backend/data:/backend/data
    environment:
      APP_ENV: production
    # depends_on:
    #   - mqtt
    networks:
      - nodeherder

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nodeherder-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./backend/mqtt/config:/mosquitto/config
      - ./backend/mqtt/data:/mosquitto/data
      - ./backend/mqtt/log:/mosquitto/log
    networks:
      - nodeherder

networks:
  nodeherder:
    driver: bridge
