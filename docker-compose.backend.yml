services:
  backend:
    container_name: nodeherder-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4110:4110"
    env_file:
      - ./backend/.env
      - ./backend/.env.production
    volumes:
      - ./backend/configs:/backend/configs
      - ./backend/data:/backend/data
    environment:
      APP_ENV: production
    depends_on:
      - mqtt
      - zigbee2mqtt
    networks:
      - nodeherder

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nodeherder-mqtt
    restart: unless-stopped
    # ports:
    #   - "1883:1883"
    volumes:
      - ./backend/mqtt/config:/mosquitto/config
      - ./backend/mqtt/data:/mosquitto/data
      - ./backend/mqtt/log:/mosquitto/log
    networks:
      - nodeherder

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8089:8080"
    environment:
      - TZ=Europe/London
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_Sonoff_Zigbee_3.0_USB_Dongle_Plus_0001-if00-port0:/dev/ttyUSB0
    depends_on:
      - mqtt
    networks:
      - nodeherder

networks:
  nodeherder:
    driver: bridge
